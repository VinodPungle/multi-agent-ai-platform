# =============================================================================
# nginx configuration for the production frontend image.
# =============================================================================

server {
    # 8080, not 80: ports below 1024 need CAP_NET_BIND_SERVICE, which would
    # defeat running the container as an unprivileged user.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Removes the version banner from responses and error pages. Free
    # reconnaissance for an attacker otherwise.
    server_tokens off;

    # --- Security headers -----------------------------------------------------
    # The bundle is fully self-contained; `connect-src` is widened per
    # environment when the API is served from another origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # --- Static assets --------------------------------------------------------
    # Vite fingerprints every asset filename, so a change produces a new URL and
    # these can be cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Application shell ----------------------------------------------------
    # `index.html` must never be cached: it is the document that points at the
    # fingerprinted assets, so a stale copy pins users to an old deployment.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # SPA fallback — client-side routes have no file on disk.
        try_files $uri $uri/ /index.html;
    }

    # Health probes must not be rewritten to index.html by the fallback above.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
