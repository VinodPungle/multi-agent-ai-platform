# =============================================================================
# Continuous Integration
# =============================================================================
# Every gate the handbook requires of a change: formatting, linting, type
# checking, tests, container builds, image scanning and infrastructure
# validation.
#
# The quality and image jobs come from reusable workflows shared with the
# deployment pipeline, so a release cannot pass checks a pull request would have
# failed. Duplicated, they drift — and the drift always favours the release
# pipeline, because that is the one under time pressure.
#
# Triggers
#   Also on feature branches, not only main. That is not a convenience: with
#   triggers limited to main and pull requests to it, six milestones of work on
#   a long-lived feature branch produced exactly zero CI runs. A gate nothing
#   reaches is not a gate.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'infra/**'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref. Queuing obsolete runs
# wastes minutes and delays feedback on the commit that matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  quality:
    name: Quality gates
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  images:
    name: Container images
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      # Build and verify only. Publication belongs to the deployment pipeline,
      # which knows which registry and which environment.
      push: false
      image-tag: ci-${{ github.sha }}

  # ---------------------------------------------------------------------------
  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Lint Bicep templates
        # `--stdout` discards the compiled ARM output: this step checks the
        # templates are valid, it does not produce a deployment artefact.
        run: |
          for template in $(find infra/bicep -name '*.bicep' -not -path '*/modules/*'); do
            echo "Linting ${template}"
            bicep build "${template}" --stdout > /dev/null
          done

      - name: Validate environment parameter files
        # Every environment, not just the default one. A `.bicepparam` that
        # references a parameter the template no longer has is only discovered
        # at deploy time otherwise — which is to say, during a deployment.
        run: |
          for params in infra/environments/*.bicepparam; do
            echo "Validating ${params}"
            bicep build-params "${params}" --stdout > /dev/null
          done

      - name: Validate azure.yaml
        run: |
          python -c "import yaml,pathlib,sys; yaml.safe_load(pathlib.Path('azure.yaml').read_text()); print('azure.yaml is valid YAML')"

      - name: Lint the workflows themselves
        # The pipeline is code, and it is the only code with no type checker and
        # no test suite. actionlint catches an undefined expression, a bad
        # `needs` reference or a wrong action input — all of which otherwise
        # fail at the least useful moment, mid-run, on the branch that triggered
        # them.
        uses: rhysd/actionlint@v1.7.7
        with:
          fail-on-error: true

      - name: Validate the pre-flight scripts
        # They run before every provision. A syntax error in one is discovered
        # at the least convenient moment otherwise.
        run: |
          sh -n infra/scripts/preflight.sh
          echo "preflight.sh parses"
          pwsh -NoProfile -Command "
            \$errors = \$null
            [System.Management.Automation.Language.Parser]::ParseFile('infra/scripts/preflight.ps1', [ref]\$null, [ref]\$errors) > \$null
            if (\$errors.Count -gt 0) { \$errors | ForEach-Object { Write-Error \$_.Message }; exit 1 }
            Write-Host 'preflight.ps1 parses'
          "

  # ---------------------------------------------------------------------------
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan the filesystem for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          # Report everything; the gate below fails only on severities worth
          # blocking a merge over.
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Publish results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: filesystem

      - name: Fail on high or critical findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, images, infrastructure, security]
    if: always()

    steps:
      - name: Verify every gate passed
        # One required check for branch protection. Without it, protecting the
        # branch means listing every job by name and updating that list whenever
        # the pipeline changes — which is forgotten exactly when a new gate is
        # added, silently making it optional.
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more gates failed."
            exit 1
          fi
          echo "All gates passed."
