# =============================================================================
# Reusable: container build, verify, scan and publish
# =============================================================================
# One workflow for both images and both purposes. On a pull request it builds,
# runs and scans them without publishing; on a release it does the same and then
# pushes to Azure Container Registry.
#
# The image that is pushed is the image that was verified. Building twice — once
# to test, once to publish — would mean the artefact that reaches production is
# not the one that passed, and the difference is invisible until it matters.
#
# Publishing authenticates with OIDC federated credentials. No registry password
# and no service principal secret exists to be stored, rotated or leaked, which
# is the same argument that removed API keys from the application itself.
# =============================================================================

name: Reusable — container images

on:
  workflow_call:
    inputs:
      push:
        description: Publish to ACR. False builds and verifies only.
        type: boolean
        default: false
      registry:
        description: ACR login server, e.g. myregistry.azurecr.io. Required when push is true.
        type: string
        default: ''
      image-tag:
        description: Tag applied to published images. Usually the commit SHA.
        type: string
        default: ci
      backend-api-url:
        description: Baked into the frontend bundle at build time. Vite has no runtime configuration.
        type: string
        default: http://localhost:8000
      fail-on-severity:
        description: Image vulnerability severities that fail the build.
        type: string
        default: 'HIGH,CRITICAL'
    secrets:
      azure-client-id:
        required: false
      azure-tenant-id:
        required: false
      azure-subscription-id:
        required: false

permissions:
  contents: read

jobs:
  images:
    name: Build, verify and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      # Required for OIDC. Without it `azure/login` cannot request a token and
      # the failure message does not mention permissions.
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure
        if: inputs.push
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}

      - name: Sign in to the container registry
        if: inputs.push
        # A short-lived token from the federated identity, not a stored
        # password. The registry's admin user stays disabled.
        run: az acr login --name "${REGISTRY%%.*}"
        env:
          REGISTRY: ${{ inputs.registry }}

      # --- Build ------------------------------------------------------------
      # `load: true` puts the image in the local daemon so the verify steps can
      # run it. Verification comes before publication, always.

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: production
          push: false
          load: true
          tags: agent-platform-backend:${{ inputs.image-tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: production
          push: false
          load: true
          tags: agent-platform-frontend:${{ inputs.image-tag }}
          build-args: |
            VITE_API_BASE_URL=${{ inputs.backend-api-url }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # --- Verify -----------------------------------------------------------

      - name: Verify the backend image serves traffic
        # Building an image proves it compiles, not that it runs. Starting it
        # and probing /live is what catches a broken entrypoint, a missing
        # runtime dependency, or a permission error from running as non-root.
        run: |
          docker run --detach --name backend-ci \
            --env PLATFORM_APP__ENVIRONMENT=testing \
            --publish 8000:8000 \
            agent-platform-backend:${{ inputs.image-tag }}

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/live > /dev/null; then
              echo "Backend responded after ${attempt} attempt(s)."
              curl --silent http://localhost:8000/health
              docker rm --force backend-ci
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy. Container logs:"
          docker logs backend-ci
          docker rm --force backend-ci
          exit 1

      - name: Verify the frontend image serves the bundle
        run: |
          docker run --detach --name frontend-ci --publish 8080:8080 \
            agent-platform-frontend:${{ inputs.image-tag }}

          for attempt in $(seq 1 20); do
            if curl --silent --fail http://localhost:8080/healthz > /dev/null; then
              echo "Frontend responded after ${attempt} attempt(s)."
              curl --silent --fail http://localhost:8080/ | head -c 200
              docker rm --force frontend-ci
              exit 0
            fi
            sleep 2
          done

          echo "Frontend did not become healthy. Container logs:"
          docker logs frontend-ci
          docker rm --force frontend-ci
          exit 1

      # --- Scan -------------------------------------------------------------
      # The built images, not the source tree. A filesystem scan cannot see a
      # vulnerable package that arrived in a base image, which is where most
      # container CVEs actually come from.

      - name: Scan both images
        # Scanned from an exported tar rather than the daemon, so Trivy runs in
        # its own container without a socket mount. The published image is a
        # fixed artefact; `trivy-action` fetches an install script from a moving
        # branch at run time, and that script failed on the runner.
        run: |
          set -eu
          mkdir -p scan
          for service in backend frontend; do
            docker save "agent-platform-${service}:${{ inputs.image-tag }}" \
              --output "scan/${service}.tar"

            docker run --rm \
              --volume "${PWD}/scan:/scan" \
              ${TRIVY_IMAGE} image \
                --input "/scan/${service}.tar" \
                --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                --format sarif \
                --output "/scan/trivy-${service}.sarif" \
                --no-progress
          done
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0

      - name: Publish image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: scan
          category: container-images

      - name: Fail on high or critical image findings
        # Only findings with a fix available. A CVE nobody can remediate stops
        # every build indefinitely and teaches people to bypass the gate, which
        # costs more security than it buys.
        run: |
          set -eu
          for service in backend frontend; do
            echo "Gating ${service}"
            docker run --rm \
              --volume "${PWD}/scan:/scan" \
              ${TRIVY_IMAGE} image \
                --input "/scan/${service}.tar" \
                --severity ${{ inputs.fail-on-severity }} \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress
          done
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.65.0

      # --- Publish ----------------------------------------------------------
      # Retagging what was verified rather than rebuilding. The artefact that
      # reaches the registry is byte-identical to the one that passed.

      - name: Publish images
        if: inputs.push
        run: |
          set -eu
          for service in backend frontend; do
            local_tag="agent-platform-${service}:${{ inputs.image-tag }}"
            remote="${{ inputs.registry }}/agent-platform-${service}"

            docker tag "${local_tag}" "${remote}:${{ inputs.image-tag }}"
            docker tag "${local_tag}" "${remote}:latest"

            docker push "${remote}:${{ inputs.image-tag }}"
            docker push "${remote}:latest"
            echo "Published ${remote}:${{ inputs.image-tag }}"
          done
