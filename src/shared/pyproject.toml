[project]
name = "agent-platform-shared"
version = "0.1.0"
description = "Cross-cutting runtime utilities shared by every platform service"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

# Intentionally dependency-free. This package sits at the bottom of the
# dependency graph; anything it imports is imposed on every service that
# imports it. Standard library only.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform_shared"]
